# Render.com Configuration for Employee Reimbursement Manager Backend

services:
  - type: web
    name: employee-reimbursement-api
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./reimbursement.db
        # For PostgreSQL, use: postgresql://user:pass@host:5432/dbname
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: bill-images
      mountPath: /opt/render/project/src/bill_images
      sizeGB: 1
