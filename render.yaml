# Render.com Blueprint
# Service Name: reimbursesys
# URL: https://reimbursesys.onrender.com

services:
  - type: web
    name: reimbursesys
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./reimbursement.db
      - key: CORS_ORIGINS
        value: "https://reimbursesys.netlify.app,http://localhost:3000"
    disk:
      name: bill-images
      mountPath: /opt/render/project/src/bill_images
      sizeGB: 1
